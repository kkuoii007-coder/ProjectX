# Runs on every pull request and on every push to main. Two jobs:
#   tests   - the Django test suite;
#   browser - the reader in a real browser (tools/qa/fork_steps.js).
# The database is a clean PostgreSQL 16 with pgvector available but not
# enabled: the migrations themselves must create the extension.
# No paid calls: the tests use the fake provider (config/settings/test.py);
# the browser job publishes its two texts with a stub in the reviewer's place
# (tools/qa/seed_browser_check.py, which refuses to run anywhere else).
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # A newer push to a pull request replaces its run; every commit on main is tested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: philosophy_reader
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: philosophy_reader
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U philosophy_reader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret-key
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: philosophy_reader
      DB_USER: philosophy_reader
      DB_PASSWORD: ci-only-password
      OPENROUTER_API_KEY: ""
      LIVE_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Django system check
        run: python manage.py check
      - name: No model change without a migration
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate a clean database
        run: python manage.py migrate --noinput
      - name: Tests
        run: python manage.py test --noinput

  browser:
    # What only a browser can show: the text opens answer by answer, keeps its
    # place, survives two tabs, a late script and a broken one.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: philosophy_reader
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: philosophy_reader
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U philosophy_reader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The development settings: the server itself serves the static files.
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-secret-key
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: philosophy_reader
      DB_USER: philosophy_reader
      DB_PASSWORD: ci-only-password
      OPENROUTER_API_KEY: ""
      LIVE_AI_ENABLED: "false"
      AI_PROVIDER: fake
      # The seed script works only with this, on this throw-away database.
      PR_BROWSER_CHECK: "1"
      # A tool of this job, not a dependency of the project: no package.json.
      PLAYWRIGHT_VERSION: "1.59.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Playwright and Chromium, outside the checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_PATH=$RUNNER_TEMP/playwright/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Migrate a clean database
        run: python manage.py migrate --noinput
      - name: Two published texts, an olive copy and a reader
        run: python tools/qa/seed_browser_check.py --olive-copy
      - name: Start the server
        run: |
          python manage.py runserver 127.0.0.1:8011 --noreload --nothreading > "$RUNNER_TEMP/server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8011/read/what-does-it-mean-to-be-brave/; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - name: The reader in a browser
        run: >-
          node tools/qa/fork_steps.js --no-shots
          --login=browser-check-reader:browser-check-only
          --tones=clay:/read/what-does-it-mean-to-be-brave/,sea:/read/why-do-people-live-in-cities/,olive:/read/browser-check-olive/
          --revised=/read/browser-check-olive/
          --republish="python tools/qa/seed_browser_check.py --new-revision"
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
