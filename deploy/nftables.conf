#!/usr/sbin/nft -f
# Philosophy Reader VPS firewall.
# Philosophy: default-drop on the public interface, explicit allows only.
# Loopback and Docker networks (Hermes, 172.17.0.0/16 + 172.22.0.0/16) are
# left untouched: Docker manages its own iptables chains for container
# traffic; we only filter traffic entering from the public NIC.
# Ports: 22 (SSH), 80 (HTTP redirect), 443 (HTTPS).

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Loopback is always trusted.
        iif "lo" accept

        # Established/related connections stay allowed.
        ct state established,related accept

        # Invalid packets are dropped early.
        ct state invalid drop

        # SSH (fail2ban inserts its own table; base port allowed here).
        tcp dport 22 accept

        # Web: HTTP (redirect) and HTTPS.
        tcp dport 80 accept
        tcp dport 443 accept

        # ICMP: allow ping and IPv6 neighbour discovery essentials.
        ip protocol icmp accept
        meta l4proto ipv6-icmp accept

        # DHCPv6 client (some VPS setups renew leases).
        udp dport 546 accept

        counter log prefix "nft-drop-input: " limit rate 5/minute burst 10 packets drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        # Docker published ports and container NAT are managed by Docker's own
        # iptables rules, which run at different hook priorities. Nothing on
        # this host needs extra forwarding: allow established flows only.
        ct state established,related accept
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
