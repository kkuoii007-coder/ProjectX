# Philosophy Reader public entry (IP-addressed, no domain yet).
# Install as /etc/nginx/sites-available/philosophy-reader + symlink in
# sites-enabled. Remove the stock default site if enabled.

# Connection/request limits: keep the small VPS (2 GB, 1 gunicorn worker)
# from being saturated by scrapers or simple floods.
limit_req_zone $binary_remote_addr zone=pr_general:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=pr_login:10m rate=6r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME placeholder for a future domain; everything else redirects.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/philosophy-reader/tls/philosophy-reader.crt;
    ssl_certificate_key /etc/philosophy-reader/tls/philosophy-reader.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Self-signed cert: do not send OCSP queries (no responder exists).
    ssl_stapling off;

    server_tokens off;

    # 5 MB matches SOURCE_UPLOAD_MAX_BYTES with headroom for form overhead.
    client_max_body_size 6m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static: immutable (hashed filenames), served from STATIC_ROOT.
    location /static/ {
        alias /opt/philosophy-reader/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Sensitive endpoints get a strict rate limit (fail2ban reads the
    # nginx-limit-req jail from error.log).
    location ~ ^/(accounts/(login|register)/|admin/login/) {
        limit_req zone=pr_login burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8801;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=pr_general burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8801;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
