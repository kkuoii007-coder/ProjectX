{% extends 'base.html' %}
{% block content %}
<section class="workshop-page">
    <div class="wrap">
        <p class="kicker kicker--night">Мастерская</p>
        <h1>Новый проект</h1>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% if error == 'Недостаточно кредитов для этого действия' %}<p><a href="{% url 'account:credits' %}">Добавить
                кредиты</a> · <a href="{% url 'library:home' %}">Продолжить чтение</a></p>{% endif %}
        {% endif %}
        <form method="post">{% csrf_token %}
            <input type="hidden" name="mode" value="explain_topic">
            <label for="topic">Тема</label>
            <textarea id="topic" name="topic" maxlength="2000" required>{{ topic }}</textarea>
            <button type="submit">Создать текст</button>
        </form>
    </div>
</section>
{% endblock %}
