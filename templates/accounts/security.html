{% extends 'base.html' %}
{% block content %}<h1>Безопасность</h1><section><h2>Смена пароля</h2><form method="post" action="{% url 'account:change_password' %}">{% csrf_token %}<p><label for="current">Текущий пароль</label><input id="current" name="current_password" type="password" required></p><p><label for="new">Новый пароль</label><input id="new" name="new_password" type="password" minlength="12" maxlength="128" required></p><p><label for="new2">Повторите новый пароль</label><input id="new2" name="new_password_confirm" type="password" required></p><button type="submit">Сменить пароль и отозвать другие сеансы</button></form></section><section><h2>Сеансы</h2><form method="post" action="{% url 'accounts:logout_all' %}">{% csrf_token %}<button type="submit">Выйти из всех сеансов</button></form></section><section class="warning"><h2>Деактивация аккаунта</h2><p>Восстановления нет. Окончательная очистка приватных данных выполняется отдельной операцией.</p><form method="post" action="{% url 'account:delete' %}">{% csrf_token %}<p><label for="delete-password">Подтвердите текущий пароль</label><input id="delete-password" name="password" type="password" required></p><button type="submit">Деактивировать аккаунт</button></form></section>{% endblock %}
