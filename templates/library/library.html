{% extends 'base.html' %}
{% block content %}<h1>Библиотека</h1><form method="get"><label for="q">Поиск по названию и мыслителю</label><input id="q" name="q" value="{{ query }}"><button type="submit">Найти</button></form><div class="cards">{% for p in publications %}<article class="card"><h2><a href="{% url 'library:read' p.slug %}">{{ p.revision.payload.title_ru }}</a></h2><p>{{ p.revision.payload.lead_ru|default:'' }}</p></article>{% empty %}<p>Ничего не найдено.</p>{% endfor %}</div>{% endblock %}
